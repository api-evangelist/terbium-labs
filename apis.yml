name: Terbium Labs
description: >-
  Terbium Labs was a Baltimore-based dark web data intelligence and digital risk
  protection company (founded 2013) best known for Matchlight, a fully private,
  automated platform that used patented data-fingerprinting to detect a
  customer's sensitive data (PII, credentials, intellectual property) as it
  appeared for sale or leak across the open, deep, and dark web. Matchlight was
  offered through a web console and a REST API, plus an "Unstructured Data Pipe"
  that streamed raw crawled dark-web source data to partners. Terbium Labs was
  acquired by Deloitte in June 2021, with its technology, most staff, and
  customers folded into Deloitte's Detect & Respond cyber practice. The
  independent company no longer operates and its developer surface at
  terbiumlabs.com is offline (the domain resolves no A records and there is no
  public GitHub organization), so no live API artifacts can be harvested.
